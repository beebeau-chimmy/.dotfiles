# Set programs that you use
$terminal = alacritty
$fileManager = nautilus
$browser = microsoft-edge-stable
$menu = ~/.config/rofi/launchers/type-6/launcher.sh
# $menu = ~/.config/rofi/launchers/launcher.sh

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, RETURN, exec, $terminal
bind = $mod, q, killactive,
bind = $mod, w, exec, $browser
# bind = $mod SHIFT, e, exec, ~/.config/rofi/powermenu/type-2/powermenu.sh
bind = $mod SHIFT, e, exec, ~/.config/rofi/powermenu/type-6/powermenu.sh
bind = $mod, n, exec, $fileManager
bind = $mod SHIFT, r, exec, ~/.config/hypr/scripts/reload.sh
bind = $mod, v, togglefloating,
bind = $mod, SPACE, exec, $menu
bind = $mod, p, pseudo, # dwindle
bind = $mod, u, togglesplit, # dwindle
bind = $mod, f, fullscreen
bind = $mod SHIFT, f, fakefullscreen

# Move focus with mainMod + arrow keys
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

bind = $mod CONTROL, h, swapwindow, l
bind = $mod CONTROL, l, swapwindow, r
bind = $mod CONTROL, k, swapwindow, u
bind = $mod CONTROL, j, swapwindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod, o, workspace, e+1
bind = $mod, i, workspace, e-1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume
bind =, XF86AudioPlay, exec, playerctl play
bind =, XF86AudioPlay, exec, playerctl pause
bind =, XF86AudioPlay, exec, playerctl next
bind =, XF86AudioPlay, exec, playerctl previous

bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Mute

bindel =, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel =, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bindel = $mod, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = $mod, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
